<body>
    <script>
        let names = ['Jack', 'John', 'Bill', 'John', 'Rick', 'Bill', 'John'];
            // expected result: {Jack: 1, John: 3, Bill: 2, Rick: 1}

        let result = names.reduce((count, name) => {
                count[name] = (count[name] || 0) + 1; 
                return count;
            }, {});

            console.log(result);    
    </script>
