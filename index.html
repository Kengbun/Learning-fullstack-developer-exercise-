<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const array1 = [9, 17, 23, 5];
            // ค่าที่มากกว่า 10
            				

        const array2 = [1, 2, 3, 4];
            // ค่าที่เป็นเลขคี่
            				

        const array3 = [1, '1', 2, {}];
            // ค่าที่ประเภทข้อมูลเป็น Number

        let result1 = array1.filter((array1) => array1 > 10);
        console.log(result1); 
        
        let result2 = array2.filter((array2) => array2 % 2 !== 0);
        console.log(result2);

        let result3 = array3.filter((array3) => typeof array3 === "number");
        console.log(result3);
        
    </script>
</body>
</html>
