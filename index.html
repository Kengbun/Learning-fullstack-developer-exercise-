<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const array1 = [1, 2, 30, 400];
        const array2 = [1, 2, 3, 4];
        const array3 = [1, '1', 2, {}];

        let result1 = array1.map((num) => num*2);
        console.log(`array1 : ${result1}`);

        let result2 = array2.map((num) => String(num));
        console.log(`array2 : ${result2}`);
        console.log(typeof result2[1]);

        let result3 = array3.map((element) => typeof element);
        console.log(`array3 : ${result3}`)

    </script>
</body>
</html>
