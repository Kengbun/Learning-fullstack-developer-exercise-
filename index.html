<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Sale{
            constructor(name = ''){
                this.name = name;
            }
            calcPrice(){
                return 0;
            }
        };

        class Beverage extends Sale{
            constructor(name, amount, price, discount) {
                super(name);
                this.amount = amount;
                this.price = price;
                this.discount = discount;
            }
            calcPrice(){
                let totalPrice = this.amount * this.price;
                let discountedPrice = totalPrice * (1 - this.discount);
                return discountedPrice;
            }
        }
         let beverage = new Beverage("Pepsi", 3, 19, 0.1);
        
         console.log(alert(`final_prive = ${beverage.calcPrice()}`))
    </script>
</body>
</html>
