<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const persons = [
                { name: 'John', sex: 'M' },
                { name: 'Jody', sex: 'M' },
                { name: 'Susan', sex: 'F' },
                { name: 'Kate', sex: 'F' },
                { name: 'Sid', sex: 'M' }
            ];
            // expexted result: { M: ['John', 'Jody', 'Sid'], F: ['Susan', 'Kate'] }

        let result = persons.reduce((acc, persons) => {
            if(!acc[persons.sex]) {
                acc[persons.sex] = [];
            }
            acc[persons.sex].push(persons.name);
            return acc
        },{});
        console.log(result);    
        
    </script>
</body>
