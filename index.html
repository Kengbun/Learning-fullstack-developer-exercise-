<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        function Accumukator(startingValue){
            this.currentValue = startingValue;
            this.read = function(){
                let input = +prompt("Enter a value to add: ");
                this.currentValue += input;
            };
            this.show = function(){
                alert(this.currentValue);
            };
        };
        
        let accumukator = new Accumukator(10);

        accumukator.read();
        accumukator.show();


            
    </script>
</body>
</html>
