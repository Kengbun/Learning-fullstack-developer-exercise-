<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const array1 = ['apple', 'banana', 'orange', 'pineapple', 'watermeon'];
            // ค่าที่มีตัวอักษรมากกว่า 6 ตัว"					

        const array2 = [1, -3, 2, 8, -4, 5];
        // ค่าที่เป็นเลขบวก"					

        const array3 = [1, 3, 4, 5, 6, 7, 8];
        // ค่าที่หาร 3 ลงตัว"	

        let result1 = array1.filter((array1) => array1.length > 6);
        console.log(result1);

        let result2 = array2.filter((array2) => array2 > 0);
        console.log(result2)

        let result3 = array3.filter((array3) => array3 % 3 === 0);
        console.log(result3);
        
    </script>
</body>
</html>
