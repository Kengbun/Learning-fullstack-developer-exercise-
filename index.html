<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const TOKEN = {
            'color-primary-500': '#3498db',
            'color-secondary-500': '#2ecc71',
            'text-color': '#333333',
            'font-base': '16px',
            'font-weight-light': '300',
            'font-weight-regular': '400',
            'font-weight-bold': '700',
            'spacing-small': '8px',
            'spacing-medium': '16px',
            'spacing-large': '24px',
            'border-radius-small': '4px',
            'border-radius-medium': '8px',
            'border-radius-large': '12px',
        }

        let tokenName = prompt("input");

        if(TOKEN.hasOwnProperty(tokenName)){
            
            let result = TOKEN[tokenName];
            alert(`Design token ${tokenName}: ${result}`);
            console.log(result)
        }else{
            alert(`Design token ${tokenName} not found.`);
        }


    </script>
</body>
</html>
