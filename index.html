<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        	let john = { name: 'John', age: 27 };
            let jo = { name: 'Jo', age: 21 };
            let jin = { name: 'Jin', age: 25 };

            let arr = [john, jo, jin];

            function getAverageAge(arr) {
                let sumAge = arr.reduce((a, b) => a + b.age,0);
                let ageString = arr.map(person => person.age).join(' + ');
                return `(${ageString}) / ${arr.length} = ${(sumAge / arr.length).toFixed(2)}`;
            };

            console.log(getAverageAge(arr)); // (27 + 21 + 25) / 3 = 24.
    </script>
</body>
</html>
