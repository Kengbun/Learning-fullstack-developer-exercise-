<body>
    <script>
        
        let Obj = {};

        while (true) {
            let key = prompt("input key");
            if(key === "stop") break;
            
            let value = prompt("input value");
            if(value === "stop") break;

            Obj[key] = value;
        }
    console.log(Obj)
    </script>
