<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const array = [
            { name: 'John', birth: '2001-07-31' },
            { name: 'Jack', birth: '1990-06-24' },
            { name: 'Jim', birth: '1984-12-13' },
            { name: 'Jeff', birth: '1996-02-05' },
            { name: 'Joe', birth: '2002-06-13' }
        ];
            // เกิดเดือน 6"	
        let result = array.filter(function(person) {
            let dateOfBirth = new Date(person.birth);
            let monthOfBirth = dateOfBirth.getMonth()+1 === 6;
            // console.log(person.name, monthOfBirth);
            return monthOfBirth
        });
        console.log(result);
    </script>
</body>
</html>
