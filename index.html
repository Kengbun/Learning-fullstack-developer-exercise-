<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let score = +prompt("input");
        let grade = (score >= 80) ? "A" :
                    (score >= 70) ? "B" : 
                    (score >= 60) ? "c" : 
                    (score >= 50) ? "d" : "F" ;
        alert(grade);             
    </script>
</body>
</html>
