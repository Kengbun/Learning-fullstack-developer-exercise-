<body>
    <script>


        function ask(question, yes, no) {
            if (confirm(question)) yes();
            else no();
        };
        
        function yes(){
            return alert("I'm agree with you?")
        }
        function no(){
            return alert("Whyyyyyyy !")
        }
        
        ask("Do you agree?",yes ,no)

    </script>
