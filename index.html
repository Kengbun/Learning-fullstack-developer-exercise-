<!DOCTYPE html>

<body>
    <script>
        let removeRandom = arr => {
           let inr =  Math.floor(Math.random() * arr.length);
           return [...arr.slice(0, inr), ...arr.slice(inr + 1)]
        };
        
        let a = [1, 2, 3, 4, 5, 6]
        console.log(removeRandom([1, 2, 3, 4, 5])); 
        console.log(removeRandom(a))
        console.log(a)
        
    </script>
</body>
</html>
