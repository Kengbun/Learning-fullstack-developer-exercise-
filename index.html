<body>
    <script>
        function mergeObjects(...obj) {
            return Object.assign({},...obj);
        };
        let obj1 = { a: 1, b: 2 };
        let obj2 = { b: 3, c: 4 };
        let obj3 = { d: 5 };

        console.log(mergeObjects(obj1, obj2, obj3));
    </script>
</body>
