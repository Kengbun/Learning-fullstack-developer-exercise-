<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const array1 = ['apple', 'banana', 'orange'];
        const array2 = [1, 3, 4, 5, 6, 7, 8];
        const array3 = [1, -3, 2, 8, -4, 5];

        let result1 = array1.map((str) => str.toUpperCase());
        console.log(`arr1 : ${result1}`);

        let result2 = array2.map((num) => num % 2 === 0? "even" : "odd" );
        console.log("arr2 :",result2)

        let result3 = array3.map((num) => Math.abs(num));
        console.log(result3)

    </script>
</body>
</html>
