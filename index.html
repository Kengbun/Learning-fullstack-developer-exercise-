<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numbers = [];
        let sum = 0;

        while (true) {
            let numInput = prompt("Input Numbers");
             
            if (numInput === null) {
                break;
            };
            
            number = +numInput;
            if (!isNaN(number)) {
                numbers.push(number);
            }else {
                break;
            };
        };

        numbers.forEach((num) => {
            sum += num;
        });
        
            
            
        console.log(`ผลรวม : ${sum}`);

    </script>
</body>
</html>
