<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const tasks = [
            { id: 1, name: 'Fishing' },
            { id: 2, name: 'Shopping' },
            { id: 3, name: 'Swimming' }
         ];		

         function  updateTask(id, newName,){
            let task = tasks.find(function(task){
                return task.id === id;
            });
            if(task) {
                task.name = newName;
            };
         };
         updateTask(2, "Travelling")
         console.log(tasks)
    </script>
</body>
</html>
