<body>
    <script>
        let str = 'I live in Thailand';
            // expected result: {i: 4, l: 2, v: 1, e:1, n: 2, t: 1, h:1, a:2, d:1}
        let cleanStr = str.toLocaleLowerCase().replace(/\s+/g,"");    
        let result = cleanStr.split("").reduce((count, char) => {
            count[char] = (count[char] || 0) + 1;
            return count; 
        },{});
        console.log(result);     
    </script>
