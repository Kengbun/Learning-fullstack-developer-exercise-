<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = prompt('input');
        
        a = Number(a);

        switch (a) {
            case 1:
                alert("One")
                break;
            case 0:
                alert("Zero")    
                break;
            case -1:
                alert("Minus")    
                break;
            default :
                alert("Inavalid number")
                break;
                
        }
    </script>
</body>
</html>
