<body>
    <script>
        function filterOutOdds(...num) {
            let even = [];
            num.forEach((n) => { 
                if (n % 2 === 0 ) {
                   even.push(n);
                }  
            });
            return even;
        };

        console.log(filterOutOdds(1,233,4,5,6,7,8,9,9,99,9444));
    </script>
</body>
