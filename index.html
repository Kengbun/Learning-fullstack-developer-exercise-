<body>
    <script>
        const array1 = [100, 200.25, 300.84, 400.3];
        const array2 = [0, 5, 10, 7, 6, 5, 0];
        const array3 = [1, 16, 81, 256, 625, 1296];

        let result1 = array1.map((num) => num.toFixed(2));
        console.log("arr1",result1)

        let months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        let result2 = array2.map((num) => months[num]);
        console.log("arr2" , result2);

        function root (num){
            return Math.sqrt(num);
        };
        let squareRoot = array3.map(root);
        let result3 = squareRoot.map(root);
        // console.log("arr3",squareRoot);
        console.log("arr3",result3);
    </script>
